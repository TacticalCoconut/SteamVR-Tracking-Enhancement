name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        shell: cmd
        run: test.cmd

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $root = "package/SVREnhance"
          New-Item -ItemType Directory -Force "$root/tools", "$root/third_party/openvr", "$root/docs" | Out-Null
          Copy-Item dist -Destination $root -Recurse
          Copy-Item install.cmd, uninstall.cmd, README.md, LICENSE, CHANGELOG.md -Destination $root
          Copy-Item tools/svrenhance.py -Destination "$root/tools"
          Copy-Item docs/*.md -Destination "$root/docs"
          Copy-Item third_party/openvr/LICENSE -Destination "$root/third_party/openvr"
          $zip = "SVREnhance-$version-win64.zip"
          Compress-Archive -Path $root -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SVREnhance-win64
          path: ${{ env.ZIP }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SVREnhance-win64

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem *.zip | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $zip --repo $env:GITHUB_REPOSITORY --title "SVREnhance $env:GITHUB_REF_NAME" --generate-notes
