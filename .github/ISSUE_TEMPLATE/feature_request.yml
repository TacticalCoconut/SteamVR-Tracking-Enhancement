name: Idea or request
description: Something SVREnhance should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you experience in VR, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you propose?
  - type: textarea
    id: hardware
    attributes:
      label: Your hardware
      description: Headset, controllers, trackers, base stations.
